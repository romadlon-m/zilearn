<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZI Insight — ZI Learning</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .artikel-wrap {
      max-width: 860px;
      margin: 0 auto;
    }
    .artikel-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.875rem;
      color: var(--muted);
      text-decoration: none;
      margin-bottom: 1rem;
    }
    .artikel-back:hover { color: var(--primary); text-decoration: none; }
    .artikel-judul {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.35;
      margin-bottom: 10px;
    }
    .artikel-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 1.25rem;
    }
    .artikel-tanggal { font-size: 0.8125rem; color: var(--muted); }

    /* iframe container */
    .docs-frame-wrap {
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin-top: 1rem;
      background: #fff;
    }
    .docs-frame {
      width: 100%;
      height: 80vh;
      border: none;
      display: block;
    }
    .docs-frame-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 80vh;
      background: var(--surface);
    }

    .artikel-nav {
      display: flex;
      justify-content: flex-start;
      margin-top: 1.25rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>

<div class="app-layout">
  <div id="sidebar-container"></div>

  <main class="main-content">
    <div class="artikel-wrap">

      <!-- Loading -->
      <div id="state-loading" class="loading-overlay">
        <div class="spinner"></div>
      </div>

      <!-- Artikel -->
      <div id="state-artikel" style="display:none;">
        <a href="insight.html" class="artikel-back">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
          Kembali ke ZI Insight
        </a>

        <div class="artikel-meta">
          <span class="badge badge-primary" id="artikel-pilar"></span>
          <span class="artikel-tanggal" id="artikel-tanggal"></span>
        </div>
        <h1 class="artikel-judul" id="artikel-judul"></h1>

        <!-- iframe Google Docs -->
        <div class="docs-frame-wrap">
          <div class="docs-frame-loading" id="frame-loading">
            <div class="spinner"></div>
          </div>
          <iframe
            id="docs-frame"
            class="docs-frame"
            style="display:none;"
            allowfullscreen
            sandbox="allow-scripts allow-same-origin allow-popups"
            title="Artikel ZI Insight"
          ></iframe>
        </div>

        <div class="artikel-nav">
          <a href="insight.html" class="btn btn-ghost">← Semua Artikel</a>
        </div>
      </div>

      <!-- Error -->
      <div id="state-error" style="display:none;">
        <a href="insight.html" class="artikel-back">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
          Kembali ke ZI Insight
        </a>
        <div class="empty-state">
          <div class="empty-state-icon">⚠️</div>
          <div class="empty-state-title" id="error-judul">Artikel tidak ditemukan</div>
          <div class="empty-state-sub" id="error-sub"></div>
        </div>
      </div>

    </div>
  </main>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/sidebar.js"></script>
<script>
(async () => {
  await loadSidebar('insight');

  const params    = new URLSearchParams(window.location.search);
  const artikelId = params.get('id');

  if (!artikelId) {
    tampilError('Artikel tidak ditemukan', 'Parameter ID tidak tersedia.');
    return;
  }

  await muatArtikel(artikelId);
})();

async function muatArtikel(id) {
  try {
    const res  = await fetch(CONFIG.SHEETS_INSIGHT);
    const text = await res.text();
    const rows = parseCSV(text);
    const artikel = rows.find(r => String(r.id) === String(id));

    if (!artikel) {
      tampilError('Artikel tidak ditemukan', 'ID artikel tidak ada di database.');
      return;
    }

    // Isi header
    document.getElementById('artikel-pilar').textContent   = namaPilar(artikel.pilar);
    document.getElementById('artikel-tanggal').textContent = formatTanggal(artikel.tanggal);
    document.getElementById('artikel-judul').textContent   = artikel.judul;
    document.title = `${artikel.judul} — ZI Learning`;

    // Konversi URL Docs ke embed URL
    const embedUrl = docsToEmbedUrl(artikel.link_docs);
    if (!embedUrl) {
      tampilError('URL dokumen tidak valid', 'Hubungi admin untuk memperbaiki link artikel ini.');
      return;
    }

    // Set iframe
    const frame = document.getElementById('docs-frame');
    frame.src   = embedUrl;
    frame.onload = () => {
      document.getElementById('frame-loading').style.display = 'none';
      frame.style.display = 'block';
    };

    document.getElementById('state-loading').style.display = 'none';
    document.getElementById('state-artikel').style.display = 'block';

  } catch (e) {
    console.error(e);
    tampilError('Gagal memuat artikel', 'Periksa koneksi internet dan coba lagi.');
  }
}

function tampilError(judul, sub) {
  document.getElementById('state-loading').style.display = 'none';
  document.getElementById('state-error').style.display   = 'block';
  document.getElementById('error-judul').textContent     = judul;
  document.getElementById('error-sub').textContent       = sub;
}
</script>

</body>
</html>
