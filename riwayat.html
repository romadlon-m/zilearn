<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Riwayat — ZI Learning</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .riwayat-card {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.125rem 1.25rem;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .riwayat-skor {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      font-weight: 700;
      flex-shrink: 0;
      color: #fff;
    }
    .riwayat-info {
      flex: 1;
      min-width: 0;
    }
    .riwayat-sesi {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 2px;
    }
    .riwayat-detail {
      font-size: 0.8125rem;
      color: var(--muted);
    }
    .riwayat-card-link:hover {
      border-color: var(--primary);
      box-shadow: var(--shadow);
      transform: translateY(-1px);
      transition: all 0.15s ease;
    }
    .riwayat-badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 99px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

<div class="app-layout">
  <div id="sidebar-container"></div>

  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title">Riwayat Pembelajaran</h1>
      <p class="page-subtitle">Rekap kuis yang sudah kamu kerjakan.</p>
    </div>

    <!-- Stat ringkasan -->
    <div class="grid-4 mb-6" id="stat-container">
      <div class="stat-card">
        <div class="stat-label">Total Sesi Kuis</div>
        <div class="stat-value" id="stat-sesi">—</div>
        <div class="stat-sub">sesi selesai</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Rata-rata Nilai</div>
        <div class="stat-value" id="stat-avg">—</div>
        <div class="stat-sub">dari 100</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Benar</div>
        <div class="stat-value" id="stat-benar">—</div>
        <div class="stat-sub">dari semua soal</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Nilai Tertinggi</div>
        <div class="stat-value" id="stat-tertinggi">—</div>
        <div class="stat-sub">skor terbaik</div>
      </div>
    </div>

    <!-- List riwayat -->
    <h2 style="font-size:1rem;margin-bottom:1rem;">Riwayat Kuis</h2>
    <div id="riwayat-list">
      <div class="loading-overlay"><div class="spinner"></div></div>
    </div>

  </main>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/sidebar.js"></script>
<script>
(async () => {
  await loadSidebar('riwayat');
  await requireLogin();
  await muatRiwayat();
})();

async function muatRiwayat() {
  const listEl = document.getElementById('riwayat-list');
  const profil = await getProfil();
  if (!profil) return;

  // Fetch riwayat + semua challenge untuk label nama
  const [{ data: riwayat, error }, { data: chalData }] = await Promise.all([
    db.from('riwayat_kuis').select('*').eq('pegawai_id', profil.id).order('waktu', { ascending: false }),
    db.from('challenge').select('id, judul, area_1, area_2, nama_area_1, nama_area_2, tanggal, jumlah_soal'),
  ]);

  if (error) {
    listEl.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">⚠️</div>
        <div class="empty-state-title">Gagal memuat riwayat</div>
      </div>`;
    return;
  }

  if (!riwayat || riwayat.length === 0) {
    listEl.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">📋</div>
        <div class="empty-state-title">Belum ada riwayat kuis</div>
        <div class="empty-state-sub">Selesaikan kuis pertamamu di ZI Challenge.</div>
        <a href="challenge.html" class="btn btn-primary" style="margin-top:1rem;">Mulai Kuis</a>
      </div>`;
    tampilStat(0, 0, 0, 0);
    return;
  }

  // Map challenge by id untuk lookup cepat (include jumlah_soal untuk filter)
  const chalMap = {};
  (chalData || []).forEach(c => { chalMap[String(c.id)] = c; });

  // Kelompokkan per challenge_id
  const sesiSemua = kelompokkanSesi(riwayat, chalMap);

  // Filter: hanya tampilkan sesi yang sudah lengkap (jumlah baris >= jumlah_soal challenge)
  const sesi = sesiSemua.filter(s => {
    const chalId = s[0].challenge_id;
    if (!chalId) return true; // legacy (tanpa challenge_id) — tampilkan semua
    const c = chalMap[String(chalId)];
    const target = parseInt(c?.jumlah_soal) || CONFIG.QUIZ_JUMLAH_SOAL;
    return s.length >= target;
  });

  if (sesi.length === 0) {
    listEl.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">📋</div>
        <div class="empty-state-title">Belum ada kuis yang selesai</div>
        <div class="empty-state-sub">Selesaikan kuis di ZI Challenge untuk melihat riwayat.</div>
        <a href="challenge.html" class="btn btn-primary" style="margin-top:1rem;">Ke Challenge</a>
      </div>`;
    tampilStat(0, 0, 0, 0);
    return;
  }

  const totalSesi      = sesi.length;
  const totalBenar     = riwayat.filter(r => r.benar).length;
  const nilaiPerSesi   = sesi.map(s => hitungNilaiSesi(s));
  const avgNilai       = Math.round(nilaiPerSesi.reduce((a, b) => a + b, 0) / totalSesi);
  const nilaiTertinggi = Math.max(...nilaiPerSesi);

  tampilStat(totalSesi, avgNilai, totalBenar, nilaiTertinggi);
  renderRiwayat(sesi, nilaiPerSesi, chalMap);
}

function kelompokkanSesi(riwayat) {
  // Group by challenge_id — tiap challenge_id unik = 1 sesi
  // Baris tanpa challenge_id dikelompokkan by rentang waktu 30 menit (legacy)
  const byChallenge = {};
  const tanpaChallenge = [];

  riwayat.forEach(r => {
    if (r.challenge_id) {
      const key = String(r.challenge_id);
      if (!byChallenge[key]) byChallenge[key] = [];
      byChallenge[key].push(r);
    } else {
      tanpaChallenge.push(r);
    }
  });

  // Sesi dari challenge_id — urutkan by waktu terbaru
  const sesiChallenge = Object.values(byChallenge).sort((a, b) =>
    new Date(b[0].waktu) - new Date(a[0].waktu)
  );

  // Fallback: kelompokkan baris tanpa challenge_id by rentang 30 menit
  const INTERVAL_MENIT = 30;
  const sesiLegacy = [];
  if (tanpaChallenge.length) {
    let aktif = [tanpaChallenge[0]];
    for (let i = 1; i < tanpaChallenge.length; i++) {
      const selisih = Math.abs(new Date(aktif[aktif.length-1].waktu) - new Date(tanpaChallenge[i].waktu));
      if (selisih <= INTERVAL_MENIT * 60 * 1000) { aktif.push(tanpaChallenge[i]); }
      else { sesiLegacy.push(aktif); aktif = [tanpaChallenge[i]]; }
    }
    sesiLegacy.push(aktif);
  }

  return [...sesiChallenge, ...sesiLegacy];
}

function hitungNilaiSesi(sesi) {
  const benar = sesi.filter(r => r.benar).length;
  return Math.round((benar / sesi.length) * 100);
}

function tampilStat(sesi, avg, benar, tertinggi) {
  document.getElementById('stat-sesi').textContent      = sesi;
  document.getElementById('stat-avg').textContent       = sesi > 0 ? avg : '—';
  document.getElementById('stat-benar').textContent     = benar;
  document.getElementById('stat-tertinggi').textContent = sesi > 0 ? tertinggi : '—';
}

function labelChallenge(chalId, chalMap) {
  const c = chalMap && chalMap[String(chalId)];
  if (!c) return 'Challenge';
  const area = [c.nama_area_1||c.area_1, c.nama_area_2||c.area_2].filter(Boolean).join(' + ');
  return c.judul + (area ? ` — ${area}` : '');
}

function renderRiwayat(sesi, nilaiPerSesi, chalMap) {
  const listEl = document.getElementById('riwayat-list');
  listEl.innerHTML = '';

  const container = document.createElement('div');
  container.style.cssText = 'display:flex;flex-direction:column;gap:10px;';

  sesi.forEach((s, i) => {
    const nilai     = nilaiPerSesi[i];
    const benar     = s.filter(r => r.benar).length;
    const total     = s.length;
    const waktu     = new Date(s[0].waktu);
    const chalId    = s[0].challenge_id;
    const judul     = chalId ? labelChallenge(chalId, chalMap) : `Sesi #${sesi.length - i}`;
    const detailUrl = chalId ? `riwayat-detail.html?challenge_id=${chalId}` : null;

    const warna    = nilai >= 80 ? 'var(--success)' : nilai >= 60 ? 'var(--warning)' : 'var(--danger)';
    const predikat = nilai >= 80 ? { label: 'Baik', cls: 'badge-success' }
                   : nilai >= 60 ? { label: 'Cukup', cls: 'badge-warning' }
                   : { label: 'Perlu Belajar', cls: 'badge-danger' };

    const inner = `
      <div class="riwayat-skor" style="background:${warna};">${nilai}</div>
      <div class="riwayat-info">
        <div class="riwayat-sesi">${judul}</div>
        <div class="riwayat-detail">
          ${benar} dari ${total} soal benar &nbsp;·&nbsp;
          ${waktu.toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' })}
          &nbsp;${waktu.toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' })}
        </div>
      </div>
      <span class="riwayat-badge badge ${predikat.cls}">${predikat.label}</span>
      ${detailUrl ? '<span style="font-size:1rem;color:var(--muted);flex-shrink:0;">›</span>' : ''}
    `;

    let card;
    if (detailUrl) {
      card = document.createElement('a');
      card.href = detailUrl;
      card.style.cssText = 'text-decoration:none;cursor:pointer;';
      card.style.display = 'flex';
    } else {
      card = document.createElement('div');
    }
    card.className = 'riwayat-card';
    if (detailUrl) card.classList.add('riwayat-card-link');
    card.innerHTML = inner;
    container.appendChild(card);
  });

  listEl.appendChild(container);
}
</script>

</body>
</html>
