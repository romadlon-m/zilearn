<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZI Insight — ZI Learning</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .insight-card {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.25rem 1.5rem;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: box-shadow 0.2s, transform 0.2s;
      display: block;
      color: inherit;
      text-decoration: none;
    }
    .insight-card:hover {
      box-shadow: var(--shadow);
      transform: translateY(-2px);
      text-decoration: none;
      color: inherit;
    }
    .insight-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
      line-height: 1.4;
    }
    .insight-excerpt {
      font-size: 0.875rem;
      color: var(--text-secondary);
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .insight-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
    }
    .insight-date {
      font-size: 0.75rem;
      color: var(--muted);
    }
    .insight-read {
      font-size: 0.8125rem;
      color: var(--primary);
      font-weight: 500;
    }
  </style>
</head>
<body>

<div class="app-layout">
  <div id="sidebar-container"></div>

  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title">ZI Insight</h1>
      <p class="page-subtitle">Materi pembelajaran singkat seputar Zona Integritas, 3–5 menit baca.</p>
    </div>

    <!-- Filter pilar -->
    <div class="filter-bar" id="filter-bar">
      <button class="filter-chip active" data-filter="semua" onclick="filterInsight('semua', this)">
        Semua
      </button>
    </div>

    <!-- List artikel -->
    <div id="insight-list">
      <div class="loading-overlay"><div class="spinner"></div></div>
    </div>
  </main>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/sidebar.js"></script>
<script>
let semuaArtikel = [];

(async () => {
  await loadSidebar('insight');
  await muatInsight();
})();

async function muatInsight() {
  const listEl = document.getElementById('insight-list');
  try {
    const res  = await fetch(CONFIG.SHEETS_INSIGHT);
    const text = await res.text();
    const rows = parseCSV(text);

    semuaArtikel = rows
      .filter(r => r.judul && r.link_docs)
      .sort((a, b) => new Date(b.tanggal) - new Date(a.tanggal));

    if (semuaArtikel.length === 0) {
      listEl.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">📖</div>
          <div class="empty-state-title">Belum ada artikel</div>
          <div class="empty-state-sub">Artikel akan muncul setelah admin menambahkan konten.</div>
        </div>`;
      return;
    }

    bangunFilter(semuaArtikel);
    renderInsight(semuaArtikel);

  } catch (e) {
    console.error(e);
    listEl.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">⚠️</div>
        <div class="empty-state-title">Gagal memuat konten</div>
        <div class="empty-state-sub">Periksa koneksi internet dan coba lagi.</div>
      </div>`;
  }
}

function bangunFilter(artikel) {
  const filterBar = document.getElementById('filter-bar');
  const pilars    = [...new Set(artikel.map(a => a.pilar).filter(Boolean))].sort();
  pilars.forEach(pilar => {
    const btn = document.createElement('button');
    btn.className      = 'filter-chip';
    btn.dataset.filter = pilar;
    btn.textContent    = namaPilar(pilar);
    btn.onclick        = () => filterInsight(pilar, btn);
    filterBar.appendChild(btn);
  });
}

function filterInsight(pilar, btnEl) {
  document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
  btnEl.classList.add('active');
  const filtered = pilar === 'semua'
    ? semuaArtikel
    : semuaArtikel.filter(a => a.pilar === pilar);
  renderInsight(filtered);
}

function renderInsight(artikel) {
  const listEl = document.getElementById('insight-list');

  if (artikel.length === 0) {
    listEl.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-title">Tidak ada artikel untuk filter ini</div>
      </div>`;
    return;
  }

  listEl.innerHTML = '';
  const grid = document.createElement('div');
  grid.style.cssText = 'display:flex;flex-direction:column;gap:12px;';

  artikel.forEach(a => {
    const card = document.createElement('a');
    card.className = 'insight-card';
    card.href      = `insight-detail.html?id=${a.id}`;
    card.innerHTML = `
      <div style="margin-bottom:8px;">
        <span class="badge badge-primary">${namaPilar(a.pilar)}</span>
      </div>
      <div class="insight-title">${a.judul}</div>
      ${a.ringkasan ? `<div class="insight-excerpt">${a.ringkasan}</div>` : ''}
      <div class="insight-footer">
        <span class="insight-date">${formatTanggal(a.tanggal)}</span>
        <span class="insight-read">Baca →</span>
      </div>
    `;
    grid.appendChild(card);
  });

  listEl.appendChild(grid);
}
</script>

</body>
</html>
