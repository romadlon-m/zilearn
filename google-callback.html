<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memproses login — ZI Learning</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

  <div class="login-card" style="text-align:center;">
    <div class="login-logo">
      <img src="assets/images/Logo_ZI_Learning.png" alt="ZI Learning">
      <div class="login-logo-sub">BPS Provinsi Kepulauan Bangka Belitung</div>
    </div>
    <div class="loading-overlay" style="padding:1.5rem 0;">
      <div class="spinner"></div>
    </div>
    <p id="status-text" style="color:var(--text-secondary);font-size:0.9375rem;">
      Memproses login Google...
    </p>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
  (async () => {
    const statusEl   = document.getElementById('status-text');
    const afterLogin = sessionStorage.getItem('zi_after_login') || 'insight.html';
    const action     = sessionStorage.getItem('zi_google_action');

    try {
      const { data: { session }, error: sessionError } = await db.auth.getSession();

      if (sessionError || !session) {
        statusEl.textContent = 'Session tidak ditemukan. Mengalihkan...';
        setTimeout(() => window.location.replace('login.html'), 1500);
        return;
      }

      // ── Flow: hubungkan Google dari halaman Profil ──────────
      if (action === 'link') {
        sessionStorage.removeItem('zi_google_action');
        statusEl.textContent = 'Menghubungkan akun Google...';

        const googleEmail  = session.user.email;
        const pegawaiId    = sessionStorage.getItem('zi_link_pegawai_id');
        sessionStorage.removeItem('zi_link_pegawai_id');

        if (!pegawaiId) {
          statusEl.textContent = 'Sesi tidak valid. Mengalihkan...';
          await db.auth.signOut();
          setTimeout(() => window.location.replace('profil.html'), 1500);
          return;
        }

        const { error: updateErr } = await db
          .from('pegawai')
          .update({ google_email: googleEmail })
          .eq('id', pegawaiId);

        // Sign out Google session — user tetap login via NIP
        await db.auth.signOut();

        if (updateErr) {
          sessionStorage.setItem('zi_link_error', 'Gagal menyimpan: ' + updateErr.message);
        } else {
          sessionStorage.setItem('zi_link_success', googleEmail);
        }
        setTimeout(() => window.location.replace('profil.html'), 500);
        return;
      }

      // ── Flow: login Google biasa ────────────────────────────
      statusEl.textContent = 'Memeriksa akun...';
      const profil = await cekLinkGoogle();

      if (profil) {
        statusEl.textContent = `Selamat datang, ${profil.nama}!`;
        sessionStorage.removeItem('zi_after_login');
        setTimeout(() => redirectSetelahLogin(afterLogin), 800);
      } else {
        statusEl.textContent = 'Akun belum terhubung ke NIP. Mengalihkan...';
        sessionStorage.setItem('zi_google_email', session.user.email);
        await db.auth.signOut();
        sessionStorage.setItem('zi_need_link', '1');
        setTimeout(() => window.location.replace('login.html'), 1000);
      }

    } catch (err) {
      console.error('Callback error:', err);
      statusEl.textContent = 'Terjadi kesalahan. Mengalihkan...';
      await db.auth.signOut();
      sessionStorage.setItem('zi_login_error', 'unknown');
      sessionStorage.removeItem('zi_after_login');
      setTimeout(() => window.location.replace('login.html'), 1500);
    }
  })();
  </script>

</body>
</html>
